body{

.container{

header{

header h1{

}

header p{

.box{

h2{

}

label{

    color:#e4d5ff;
}

select{
    width:100%;
    padding:13px;

    border-radius:9px;

    background:#251b49;
    color:white;
    font-size:15px;
}

button{
    padding:13px;
    border:0;
    border-radius:9px;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.start{
    width:100%;
    background:#9865f5;
    color:white;
    margin-top:15px;
}

.question{
    background:#192c50;
    border:1px solid #7657ba;
    padding:15px;
    border-radius:12px;
    margin:15px 0;
}

.question h3{
    font-size:16px;
    color:#f1eaff;
    line-height:1.6;
}

.option{
    display:block;
    background:#293d68;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#503b80;
}

.option input{
    margin-right:8px;
}

.option.correct{
    background:#176b48;
    border:1px solid #70ffad;
}

.option.wrong{
    background:#783b4a;
    border:1px solid #ff9292;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.actions button{
    flex:1;
    min-width:110px;
    color:white;
}

.submit{
    background:#8954e9;
}

.answers{
    background:#276c9e;
}

.scorebtn{
    background:#23845d;
}

.retake{
    background:#62419a;
}

#result{
    display:none;
    margin-top:20px;
    padding:18px;
    background:#26385e;
    border-radius:12px;
    text-align:center;
    line-height:1.8;

.correctText{
    color:#70ffad;
    font-weight:bold;

.wrongText{
    color:#ff9292;
    font-weight:bold;

.feedback{
    margin-top:10px;
    padding:10px;
    background:#101d38;
    border-radius:8px;
    line-height:1.6;

#quiz{

footer{
    text-align:center;
    padding:20px;
    color:#c7b8ef;
}

@media(max-width:500px){

/* ==================================
QUIZ FUNCTIONS
================================== */

let currentQuestions=[];
let submitted=false;
let currentScore=0;
let currentUnit=-1;
let currentPart=-1;

function updateParts(){

    const unit=document.getElementById("unitSelect").value;
    const part=document.getElementById("partSelect");

    part.innerHTML='<option value="">-- Select Part --</option>';

    if(unit==="") return;

    for(let i=0;i<5;i++){

        const option=document.createElement("option");

        option.value=i;
        option.textContent="PART "+(i+1)+" - 10 QUESTIONS";

        part.appendChild(option);
    }
}

function startQuiz(){

    const unit=document.getElementById("unitSelect").value;
    const part=document.getElementById("partSelect").value;

    if(unit==="" || part===""){
        alert("Please select Unit and Part!");
        return;
    }

    currentUnit=Number(unit);
    currentPart=Number(part);

    currentQuestions=data[currentUnit][currentPart];

    if(!currentQuestions || currentQuestions.length!==10){
        alert("Question loading error!");
        return;
    }

    submitted=false;
    currentScore=0;

    document.getElementById("result").style.display="none";

    document.getElementById("quizTitle").textContent=
    "UNIT "+(currentUnit+1)+" - PART "+(currentPart+1);

    let html="";

    currentQuestions.forEach((q,index)=>{

        html+=`
        <div class="question" id="question${index}">

        <h3>${index+1}. ${q[0]}</h3>

        <div id="options${index}">
        `;

        q[1].forEach((option,optIndex)=>{

            html+=`
            <label class="option" id="option${index}_${optIndex}">

            <input type="radio"
            name="question${index}"
            value="${optIndex}">

            ${String.fromCharCode(65+optIndex)}. ${option}

            </label>
            `;

        });

        html+=`
        </div>
        <div id="feedback${index}"></div>
        </div>
        `;

    });

    document.getElementById("quiz").innerHTML=html;

    document.getElementById("quiz").scrollIntoView({
        behavior:"smooth"
    });
}

function submitQuiz(){

    if(currentQuestions.length===0){
        alert("Please start a quiz first!");
        return;
    }

    if(submitted){
        alert("Already submitted! Click RETAKE to try again.");
        return;
    }

    currentScore=0;

    currentQuestions.forEach((q,index)=>{

        const selected=document.querySelector(
        `input[name="question${index}"]:checked`
        );

        if(selected && Number(selected.value)===q[2]){
            currentScore++;
        }

    });

    submitted=true;

    showResult();

    document.getElementById("result").scrollIntoView({
        behavior:"smooth"
    });
}

function showResult(){

    const percentage=(currentScore/10)*100;

    document.getElementById("result").style.display="block";

    document.getElementById("result").innerHTML=`

    <h2>QUIZ RESULT</h2>

    <h1 class="correctText">${currentScore} / 10</h1>

    <h3>Percentage: ${percentage}%</h3>

    <p>Correct Answers: ${currentScore}</p>

    <p>Wrong Answers: ${10-currentScore}</p>

    <h3>${percentage>=80?"EXCELLENT!":percentage>=50?"GOOD JOB!":"KEEP PRACTICING!"}</h3>

    `;
}

function viewAnswers(){

    if(currentQuestions.length===0){
        alert("Please start a quiz first!");
        return;
    }

    if(!submitted){
        alert("Please SUBMIT your quiz first!");
        return;
    }

    currentQuestions.forEach((q,index)=>{

        const selected=document.querySelector(
        `input[name="question${index}"]:checked`
        );

        const correct=q[2];

        q[1].forEach((option,optIndex)=>{

            const label=document.getElementById(
            `option${index}_${optIndex}`
            );

            label.classList.remove("correct","wrong");

            if(optIndex===correct){
                label.classList.add("correct");
            }

            if(selected &&
            Number(selected.value)===optIndex &&
            optIndex!==correct){

                label.classList.add("wrong");
            }

        });

        const feedback=document.getElementById(
        "feedback"+index
        );

        feedback.innerHTML=`

        <div class="feedback">

        <span class="correctText">
        Correct Answer: ${String.fromCharCode(65+correct)}.
        ${q[1][correct]}
        </span>

        <br>

        <span class="${selected &&
        Number(selected.value)===correct ?
        "correctText":"wrongText"}">

        Your Answer:
        ${selected ?
        String.fromCharCode(65+Number(selected.value))+". "+q[1][Number(selected.value)]
        :"Not Answered"}

        </span>

        </div>

        `;

    });

}

function viewScore(){

    if(currentQuestions.length===0){
        alert("Please start a quiz first!");
        return;
    }

    if(!submitted){
        alert("Please submit your quiz first!");
        return;
    }

    showResult();

    document.getElementById("result").scrollIntoView({
        behavior:"smooth"
    });
}

function retakeQuiz(){

    if(currentUnit===-1 || currentPart===-1){
        alert("Please start a quiz first!");
        return;
    }

    startQuiz();

}
